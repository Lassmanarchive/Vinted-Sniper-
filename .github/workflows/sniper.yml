name: Vinted Sniper

on:
  workflow_dispatch:
  schedule:
    - cron: "2-59/5 * * * *"

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore seen listings
        uses: actions/cache/restore@v4
        with:
          path: |
            seen_ids.txt
            seen_ids_colmar.txt
            seen_ids_jl.txt
            seen_ids_acne.txt
            seen_ids_rl_pl.txt
            seen_ids_rl_dk.txt
            seen_ids_colmar_pl.txt
            seen_ids_colmar_dk.txt
            seen_ids_jl_pl.txt
            seen_ids_jl_dk.txt
            seen_ids_acne_pl.txt
            seen_ids_acne_dk.txt
            seen_ids_patagonia.txt
            seen_ids_patagonia_pl.txt
            seen_ids_patagonia_dk.txt
            seen_ids_rl_down.txt
            seen_ids_rl_down_pl.txt
            seen_ids_rl_down_dk.txt
            seen_ids_hollister.txt
          key: vinted-seen-${{ github.run_id }}
          restore-keys: |
            vinted-seen-

      - name: Run sniper
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python main.py

      - name: Save seen listings
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            seen_ids.txt
            seen_ids_colmar.txt
            seen_ids_jl.txt
            seen_ids_acne.txt
            seen_ids_rl_pl.txt
            seen_ids_rl_dk.txt
            seen_ids_colmar_pl.txt
            seen_ids_colmar_dk.txt
            seen_ids_jl_pl.txt
            seen_ids_jl_dk.txt
            seen_ids_acne_pl.txt
            seen_ids_acne_dk.txt
            seen_ids_patagonia.txt
            seen_ids_patagonia_pl.txt
            seen_ids_patagonia_dk.txt
            seen_ids_rl_down.txt
            seen_ids_rl_down_pl.txt
            seen_ids_rl_down_dk.txt
            seen_ids_hollister.txt
          key: vinted-seen-${{ github.run_id }}
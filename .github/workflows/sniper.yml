
name: Vinted Sniper

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore seen listings
        uses: actions/cache/restore@v4
        with:
          path: |
            seen_ids.txt
            seen_ids_it.txt
            seen_ids_colmar.txt
          key: vinted-seen-${{ github.run_id }}
          restore-keys: |
            vinted-seen-

      - name: Run sniper
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python main.py

      - name: Save seen listings
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            seen_ids.txt
            seen_ids_it.txt
            seen_ids_colmar.txt
          key: vinted-seen-${{ github.run_id }}
